<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Трактор 26/27</title>
<link rel="stylesheet" href="fonts/fonts.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Трактор"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ECEEF1"><meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  color-scheme:light;
  --ground:#EEEDEA;--ink:#111111;--muted:#6C6B67;--faint:#A6A5A0;--card:#FFFFFF;--sep:#EFEEEA;--soft:#F2F1EE;
  --accent:#FF5A1F;--accent-bg:#FFE7DB;
  --khl:#2B2D33;--khl-bg:#E6E5E1;--khl-bg2:#CFCEC8;--mhl:#1E8A58;--mhl-bg:#DDF1E5;--zhl:#B0508E;--zhl-bg:#F5E2EC;--away:#9AA3B0;
  --club:#1E9E63;--crew:#3F86DD;--tax:#8A8F98;--me:#FF5A1F;--office:#C2589B;
  --good:#157A4C;--good-bg:#E1F4EA;--warn:#A64A12;--warn-bg:#FFEBD9;--bad:#B3301D;--bad-bg:#FDE2DE;
  --spring:cubic-bezier(.3,1.35,.5,1);--num:Manrope,system-ui,sans-serif;--mono:'Martian Mono',ui-monospace,monospace;--r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:15px/1.38 Manrope,-apple-system,system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{position:fixed;inset:0;margin:0 auto;max-width:520px;overflow:hidden}
/* Приложение всегда портретное (Мельников 23.09.2026): manifest orientation=portrait для Android; на iPhone поворот не блокируется, поэтому в альбомной ориентации контент поворачивается обратно */
html[data-rot] #app{inset:0 auto auto 0;margin:0;max-width:none;width:100vh;height:100vw;transform-origin:0 0}
html[data-rot="90"] #app{transform:rotate(-90deg) translateX(-100%)}
html[data-rot="270"] #app{transform:rotate(90deg) translateY(-100%)}
html[data-rot] .views{padding-top:24px}
input,select,textarea{font-size:max(16px,1em)}
.views{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 112px);background:var(--ground)}
.views::-webkit-scrollbar{display:none}
.views.in>*{animation:rise .5s var(--spring) both}
.views.in>*:nth-child(2){animation-delay:.03s}.views.in>*:nth-child(3){animation-delay:.06s}.views.in>*:nth-child(n+4){animation-delay:.09s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.views.in>*{animation:none}.sheet{transition:none}}
.tabbar{position:absolute;left:14px;right:14px;bottom:max(14px,calc(env(safe-area-inset-bottom,0px) - 4px));z-index:6;display:flex;gap:2px;padding:6px;border-radius:36px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(15,20,25,.14)}
.tab{flex:1;appearance:none;border:0;background:transparent;color:#5E6570;font:600 10.5px/1.1 Manrope,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:30px;cursor:pointer;transition:background .25s,color .25s}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:#fff;background:var(--accent);box-shadow:0 4px 12px rgba(255,90,31,.28)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:absolute;inset:0;z-index:8;overflow:hidden;background:var(--ground);transform:translateX(104%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s linear .5s;box-shadow:-18px 0 40px rgba(0,0,0,.14)}
.sheet.open{transform:none;visibility:visible;transition:transform .5s var(--spring),visibility 0s}
.sheet .views{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.back{position:sticky;top:0;z-index:3;appearance:none;background:var(--card);border:0;box-shadow:0 6px 18px rgba(15,20,25,.12);color:var(--accent);font:700 15px Manrope,sans-serif;padding:8px 16px 8px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin:0 0 12px}
.back svg{width:9px;height:15px}
.proto{margin:0 0 14px;padding:8px 12px;border-radius:14px;background:#E4E3DF;color:#5E5D59;font:600 12px/1.35 Manrope,sans-serif}
.lt{margin:6px 4px 16px}
.lt h1{font:800 32px/1.05 Manrope,sans-serif;letter-spacing:-.045em;margin:0;text-wrap:balance}
.lt p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.g{background:var(--card);border-radius:var(--r);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.pad{padding:16px 17px}
.tile{appearance:none;border:0;display:block;width:100%;text-align:left;cursor:pointer;transition:transform .35s var(--spring)}
.tile:active,button.row:active,.day:active{transform:scale(.96);transition-duration:.12s}
.tile-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{margin:24px 6px 0;font:800 19px/1.2 Manrope,sans-serif;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec small{font:600 13px Manrope,sans-serif;color:var(--muted)}
.lbl{font-size:13px;color:var(--muted);font-weight:600}.lbl.c{font-weight:700}
.num{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.045em;white-space:nowrap}
.mono{word-spacing:-.34em;font-family:var(--mono);font-weight:500;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.big{font-size:28px;line-height:1.1;margin-top:4px}
.sub{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;appearance:none;border:0;background:transparent;text-align:left;min-height:56px}
button.row{cursor:pointer;transition:transform .35s var(--spring)}
.list .row+.row{border-top:1px solid var(--sep)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.row .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-variant-numeric:tabular-nums;font-weight:800;font-size:15.5px;white-space:nowrap;text-align:right;letter-spacing:-.03em}
.row .v small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;letter-spacing:0;white-space:normal}
.chev{color:var(--faint);width:7px;height:12px;flex:none}
.row.now{background:var(--accent-bg);box-shadow:inset 4px 0 0 var(--accent)}
.tile.now{box-shadow:inset 4px 0 0 var(--accent)}
.tile.docs{box-shadow:inset 4px 0 0 var(--crew)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:800 14px Manrope,sans-serif}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--soft);color:var(--muted)}.chip.ak{background:var(--accent-bg);color:var(--accent)} .chip.bad{background:var(--bad-bg);color:var(--bad)} select.fio{appearance:none;-webkit-appearance:none} label .lbl{margin-bottom:4px}
.chip.khl{background:var(--khl-bg);color:var(--khl)}.chip.mhl{background:var(--mhl-bg);color:var(--mhl)}.chip.zhl{background:var(--zhl-bg);color:var(--zhl)}
.dateb{width:46px;height:48px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dateb b{font:500 16px/1 var(--mono);letter-spacing:-.06em}.dateb span{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:700}
.dateb.khl{background:var(--khl-bg)}.dateb.khl b{color:var(--khl)}.dateb.mhl{background:var(--mhl-bg)}.dateb.mhl b{color:var(--mhl)}
.card{border-radius:var(--r);padding:18px 18px 16px;color:var(--ink);background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.02);position:relative;overflow:hidden;border-top:5px solid var(--accent)}
.card .lbl{color:var(--muted)}.card .mono{font-size:32px;color:var(--ink);margin-top:6px;display:block}
.card .foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:600}.card .foot b{color:var(--ink)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex;margin-top:10px}.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .num.big{font-size:clamp(17px,5.4vw,22px)}.grid2 .g{padding:14px 15px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--sep);font-size:14px}.kv:first-child{border-top:0}
.kv b{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.kv.me{color:var(--me)}.kv.of{color:var(--office)}
.row.of .t b{color:var(--office)}
.row.pr .t b{white-space:normal;overflow:visible}
.row.pr .t span{white-space:nowrap}
.note{margin:14px 6px 0;font-size:12.5px;color:var(--muted);line-height:1.45}.note b{color:var(--ink)}
.stripe{width:5px;align-self:stretch;border-radius:3px;flex:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;font:700 13px Manrope,sans-serif;padding:9px 14px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;z-index:20;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.pre{margin:0;white-space:pre-wrap;word-break:break-word;font:500 13.5px/1.5 Manrope,sans-serif;color:var(--ink)}
.row .t b.hd{color:var(--muted);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.act{appearance:none;border:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;text-align:left;cursor:pointer}.act b{font-weight:800;font-size:15px}.act span{font-size:12.5px;color:var(--muted)}
/* 16px — иначе iPhone приближает страницу при фокусе в поле и не возвращает масштаб (Мельников 23.09.2026) */
.fio{width:100%;min-width:0;font:600 16px Manrope,sans-serif;padding:8px 11px;border:1px solid #DDDBD5;border-radius:12px;background:#FAF9F7;color:var(--ink)}
.fio:focus{outline:2px solid var(--accent);border-color:transparent}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none}
label.row{cursor:pointer}
/* календарь */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px}
.mnav b{font:800 20px Manrope,sans-serif;letter-spacing:-.03em}
.mnav button{appearance:none;border:0;background:var(--card);width:38px;height:38px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.mnav button svg{width:9px;height:15px}
.cal{background:var(--card);border-radius:var(--r);padding:12px 10px 10px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}.wd span{text-align:center;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{appearance:none;border:0;background:transparent;aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:default;position:relative;transition:transform .35s var(--spring)}
.day b{font:700 14.5px Manrope,sans-serif;color:var(--ink)}
.day.off b{color:var(--faint);font-weight:600}
.day.has{cursor:pointer}
.day.khl{background:var(--khl-bg)}.day.khl b{color:var(--khl)}
.day.mhl{background:var(--mhl-bg)}.day.mhl b{color:var(--mhl)}
.day.zhl{background:var(--zhl-bg)}.day.zhl b{color:var(--zhl)}
.day.away{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--khl-bg2)}.day.away b{color:var(--khl)}
.day.two{background:linear-gradient(135deg,var(--khl-bg) 50%,var(--mhl-bg) 50%)}.day.two b{color:var(--ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.next{box-shadow:inset 0 0 0 2px var(--accent),0 4px 12px rgba(255,90,31,.25)}
.day.next b{color:var(--accent)}
.day.past.has{opacity:.72}
.day.ev:before{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.day .d{display:flex;gap:2px}.day .d i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.day.khl .d i{color:var(--khl)}.day.mhl .d i{color:var(--mhl)}.day.zhl .d i{color:var(--zhl)}.day.away .d i{color:var(--khl)}
.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 6px 0;font-size:12.5px;font-weight:600;color:var(--muted)}.clegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* ===== Вид 1 «Светлый строгий» и вид 2 «Тёмный» (01.10.2026); вид 0 — прежний ===== */
html[data-vid="1"]{--ground:#F3F3F1;--sep:#ECEBE7;--soft:#F0EFEC;--accent:#F04E1A;--accent-bg:#FDE9E1;--me:#F04E1A;--office:#7B6FA8;--crew:#3566B8;--club:#1F9460;--r:20px}
html[data-vid="2"]{color-scheme:dark;--ground:#0C0D10;--card:#16181D;--ink:#F3F2EE;--muted:#9C9B96;--faint:#5E5E5A;--sep:#24272E;--soft:#20232A;--accent:#FF6A2B;--accent-bg:#3A2115;--khl:#D9DADF;--khl-bg:#2A2D35;--khl-bg2:#474B57;--mhl:#52C792;--mhl-bg:#12301F;--zhl:#E391C4;--zhl-bg:#371F30;--away:#7C8594;--club:#52C792;--crew:#6FA2F0;--tax:#7E848E;--me:#FF6A2B;--office:#B4A6E8;--good:#5CCB93;--good-bg:#12301F;--warn:#F2A766;--warn-bg:#3A2816;--bad:#F2857A;--bad-bg:#3B1D19;--r:20px}
html[data-vid="1"] .g,html[data-vid="1"] .card,html[data-vid="1"] .cal{box-shadow:0 0 0 1px rgba(17,17,17,.045),0 1px 2px rgba(17,17,17,.04)}
html[data-vid="2"] .g,html[data-vid="2"] .card,html[data-vid="2"] .cal{box-shadow:0 0 0 1px rgba(255,255,255,.05)}
html[data-vid="1"] .mono,html[data-vid="2"] .mono{font-family:var(--num);font-weight:800;letter-spacing:-.045em;word-spacing:0}
html[data-vid="1"] .card,html[data-vid="2"] .card{border-top:0}
html[data-vid="1"] .tabbar,html[data-vid="2"] .tabbar{left:0;right:0;bottom:0;border-radius:0;gap:0;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);background:var(--card);border:0;border-top:1px solid var(--sep);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-vid="1"] .tab,html[data-vid="2"] .tab{color:var(--muted);border-radius:14px}
html[data-vid="1"] .tab[aria-selected="true"],html[data-vid="2"] .tab[aria-selected="true"]{color:var(--accent);background:transparent;box-shadow:none}
html[data-vid="1"] .views,html[data-vid="2"] .views{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
html[data-vid="1"] .sheet .views,html[data-vid="2"] .sheet .views{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
html[data-vid="1"] .lt h1,html[data-vid="2"] .lt h1{font-size:28px}
html[data-vid="2"] .tabbar{background:#121418}
html[data-vid="2"] .day.away{background:transparent}
html[data-vid="2"] .fio{background:#1D2026;border-color:#30343C}
html[data-vid="2"] #toast{background:#F3F2EE;color:#111}
html[data-vid="2"] .sheet{box-shadow:-18px 0 40px rgba(0,0,0,.5)}
html[data-vid="2"] .back{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.4)}
html[data-vid="2"] .mnav button{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
html[data-vid="2"] .proto{background:#1D2026;color:var(--muted)}
.proto.pst,html[data-vid] .proto.pst{background:transparent;padding:0 4px;margin:-4px 0 14px;font-size:12px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 4px 10px}
.top h1{font:800 30px/1.05 Manrope,sans-serif;letter-spacing:-.045em;margin:2px 0 0}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.rbtn{appearance:none;border:0;width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px rgba(128,128,128,.16);flex:none;font-weight:800}
.rbtn svg{width:19px;height:19px}
.hero{appearance:none;border:0;display:block;width:100%;text-align:left;cursor:pointer;border-radius:var(--r);padding:20px 20px 16px;background:#15171B;color:#fff;transition:transform .35s var(--spring)}
.hero:active{transform:scale(.97);transition-duration:.12s}
html[data-vid="2"] .hero{background:linear-gradient(145deg,#FF7A3C 0%,#E5400C 100%)}
.hero .lbl{color:rgba(255,255,255,.68)}
.hero .hn{font:800 40px/1.05 var(--num);letter-spacing:-.05em;margin-top:8px;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.hero .hn small{font-size:22px;font-weight:700;opacity:.65}
.hero .hb{display:flex;align-items:flex-end;gap:6px;margin-top:16px}
.hero .hb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0}
.hero .hb i{display:block;border-radius:5px 5px 2px 2px;background:#fff}
.hero .hb i.pl{background:rgba(255,255,255,.2)}
.hero .hb i.cu{background:var(--accent)}
html[data-vid="2"] .hero .hb i.cu{background:#15171B}
.hero .hb span{font-size:10px;font-weight:700;color:rgba(255,255,255,.62);text-align:center}
.hero .hf{margin-top:12px;font-size:12.5px;color:rgba(255,255,255,.72);font-weight:600}.hero .hf b{color:#fff}
html[data-vid="1"] .dateb b,html[data-vid="2"] .dateb b{font:800 16px/1 var(--num);letter-spacing:-.03em}
.blur{filter:blur(11px);-webkit-user-select:none;user-select:none}
.hero .hn{display:flex;align-items:center;gap:12px}.hero .eye{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);flex:none}.hero .eye svg{width:18px;height:18px}
.vsw{display:flex;align-items:center;gap:6px;margin:22px 6px 0;font-size:12.5px;font-weight:700;color:var(--muted)}.vsw button{border:0;cursor:pointer}
.demo{margin:0 0 12px;padding:8px 12px;border-radius:12px;background:var(--accent-bg);color:var(--accent);font:700 12px/1.3 Manrope,sans-serif;text-align:center}
/* ===== Новый вид, внутренние экраны (01.10.2026 ночь): шапка с «Назад» не наезжает на содержимое, тёмная главная карточка экрана, итоговая строка плашкой, подписи разделов, точки вместо полос ===== */
html:is([data-vid="1"],[data-vid="2"]) .back{display:flex;width:calc(100% + 32px);margin:calc(-1*(env(safe-area-inset-top,0px) + 16px)) -16px 12px;padding:calc(env(safe-area-inset-top,0px) + 13px) 16px 12px;border-radius:0;background:var(--ground);box-shadow:0 1px 0 var(--sep);color:var(--ink);font-size:15px}

const MY_DIRS = new Set(PERSON ? DATA.rates.filter(r=>r[3]===WHO).map(r=>r[0]) : []);
/* За какие направления человек отвечает в табеле: позиции «продюсер» + колонка «Отвечает за табель» листа «Люди» (или список от сервера) */

function partOk(e,dir,ops){ if(!e||!e.confirmed) return false; const dOk=e.ops?(e.dirs||[]).indexOf(dir)>=0:(!(e.dirs&&e.dirs.length)||e.dirs.indexOf(dir)>=0); if(!ops) return dOk; return e.ops?e.ops.indexOf(dir)>=0:dOk; }
function dirPart(d){ return !PERSON||TAB_DIRS.has(d); }

if(PERSON){ const STAFF=new Set((DATA.people||[]).map(p=>p[0])); const okWho=PAY_READ?(n=>STAFF.has(n)):(n=>n===WHO); if(PAY_READ) DATA.rates=DATA.rates.filter(r=>!/^(Фонд|Мельников)/.test(String(r[3]||'')));
  DATA.acc=(DATA.acc||[]).filter(a=>okWho(a[2])); DATA.pay=(DATA.pay||[]).filter(p=>okWho(p[6])); DATA.debts=(DATA.debts||[]).filter(d=>okWho(d[2])); DATA.roles=(DATA.roles||[]).filter(r=>r[0]===WHO); if(!TTV_READ&&!PAY_READ) DATA.ttv=(DATA.ttv||[]).filter(r=>r[7]===WHO); DATA.docs=[]; DATA.acts=[]; DATA.closed=[]; if(!DOC_READ){ DATA.arh=[]; } DATA.tasks=(DATA.tasks||[]).filter(t=>t[2]===WHO); DATA.adchat=(DATA.adchat||[]).map(a=>[a[0],a[1],'','',a[4],a[5],a[6]]); /* в личном виде — только отметки «смена была», без переписки */

function payView(){ const cur=mkey(TODAY); const ord=(a,b)=>{const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return ay-by||am-bm;};

  if(!months.includes(payMonth)){ const done=months.filter(k=>k!==cur); payMonth=done.length?done[done.length-1]:cur; } const k=payMonth; const rs=payRows(k); const w=payWin(k);
  const T=rs.reduce((s,x)=>({total:s.total+x.t.total,paid:s.paid+x.t.paid,off:s.off+x.t.off,due:s.due+Math.max(0,x.t.due),over:s.over+Math.max(0,-x.t.due)}),{total:0,paid:0,off:0,due:0,over:0});

  return `<div class="lt"><h1>Зарплаты</h1><p>${k===cur&&w.running?'месяц идёт · суммы растут':'сверка за месяц · '+plu(rs.length,'человек')}</p></div>${chips}
  <div class="stack"><div class="card" style="border-top-color:var(--accent)"><div class="lbl">Начислено за ${mname(k).toLowerCase()}</div><span class="mono">${fmtS(T.total)} ₽</span><div class="foot"><span>${plu(rs.length,'человек')}</span><span>${w.text?'выплата '+w.text:''}</span></div></div>
  <div class="g pad"><div class="kv"><span>Выплачено</span><b>− ${fmt(T.paid)}</b></div>${T.off?`<div class="kv"><span>Зачтено в долг</span><b>− ${fmt(T.off)}</b></div>`:''}${T.over?`<div class="kv"><span>Переплата</span><b>${fmt(T.over)}</b></div>`:''}<div class="kv me"><span>${T.due>0?'Осталось выплатить':'Всё выплачено'}</span><b>${fmt(T.due)}</b></div></div>

const ARH=(DATA.arh||[]).map(r=>({kind:r[0],num:r[1],date:String(r[2]||'').slice(0,10),party:r[3],who:r[4],month:r[5],contract:r[6],sign:String(r[7]||'').trim().toLowerCase(),link:r[8],season:r[9]}));

const arhState=d=>!arhNeeds(d)?'none':d.sign==='обе'?'ok':(d.sign==='нет'||d.sign==='одна')?'wait':'check';
function arhWait(){ return ARH.filter(d=>arhState(d)==='wait').length; }
function arhSheet(){ const dr=s=>s?s.split('-').reverse().join('.'):''; const by=s=>ARH.filter(d=>arhState(d)===s).sort((a,b)=>b.date.localeCompare(a.date)||String(a.num).localeCompare(String(b.num),'ru'));

  const wait=by('wait'), check=by('check'), ok=by('ok'), none=by('none');
  const cons=CONTRACTS.map(c=>{ const scan=ARH.find(d=>d.kind==='договор'&&d.contract===c.code); const signed=/^подписан/.test(c.status); return `<div class="row"><div class="t"><b style="white-space:normal;line-height:1.25">${esc(c.num)}</b><span style="white-space:normal">${esc(c.subject.split(/[:,(—]/)[0].trim())} · ${scan?(scan.sign==='обе'?'скан в архиве, обе подписи':'скан в архиве, подписи: '+(scan.sign||'не отмечены')):'скана в архиве нет'}</span></div><div class="v"><span class="chip ${signed&&scan&&scan.sign==='обе'?'good':'warn'}">${signed?(scan?'подписан':'нет скана'):'на подписи'}</span></div></div>`; }).join('');
  const sec=(title,list)=>list.length?`<div class="sec">${title}<small>${list.length}</small></div><div class="g list" style="margin-top:10px">${list.map(row).join('')}</div>`:'';
  const fold=(title,list)=>list.length?`<details class="g" style="margin-top:12px"><summary style="padding:13px 16px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between"><span>${title}</span><span style="color:var(--muted);font-weight:400">${list.length} ›</span></summary><div class="list">${list.map(row).join('')}</div></details>`:'';
  return `<div class="lt"><h1>Документы</h1><p>подписи и договоры · по архиву</p></div>
  <div class="stack"><div class="card" style="border-top-color:${wait.length?'var(--warn)':'var(--good)'}"><div class="lbl">Ждут подписи</div><span class="mono">${wait.length}</span><div class="foot"><span>подписаны обеими <b>${ok.length}</b></span><span>${check.length?'проверить <b>'+check.length+'</b>':''}</span></div></div></div>
  ${CONTRACTS.length?`<div class="sec">Договоры сезона<small>${CONTRACTS.length}</small></div><div class="g list" style="margin-top:10px">${cons}</div>`:''}
  ${sec('Ждут подписи',wait)}${sec('Проверить подписи',check)}${fold('Подписаны обеими сторонами',ok)}${fold('Подпись не требуется',none)}
  <div class="note">Отметка о подписях ставится при разборе файла в архиве. Пришёл подписанный экземпляр — отправьте его в бот архива, прежний файл заменится.</div>`; }
