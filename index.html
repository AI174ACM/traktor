<script>
const PLAIN = null;
const DATA_URL = "https://script.google.com/macros/s/AKfycbxCbvLT3P1cEXYuEv2BH8S8xkbIUhY2CsCmjCh339Y8W1yte-hQJCC90o1vMMJbBAKM/exec";
const SW = true;
function boot(DATA){
const TODAY = (()=>{ const s=DATA.today; if(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); } const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); })(); const VAT=0.05, USN=0.06;
const ROLE = DATA.role||'admin';
/* Личный режим сотрудника: роль person (ключ человека) или предпросмотр владельцем (?as=Фамилия / localStorage tr.as) */
let PREVIEW=''; try{ const q=new URLSearchParams(location.search).get('as'); if(ROLE==='admin'){ if(q){ PREVIEW=q; localStorage.setItem('tr.as',q); } else PREVIEW=localStorage.getItem('tr.as')||''; } }catch(e){}
const WHO = DATA.who || PREVIEW || '';
const PERSON = (ROLE==='person' || !!PREVIEW) && !!WHO;
/* Кто видит деньги договора (клубу, мне): только владелец и офис, и не в режиме предпросмотра (23.09.2026) */
const MONEY = (ROLE==='admin'||ROLE==='office') && !PREVIEW;
const MY_DIRS = new Set(PERSON ? DATA.rates.filter(r=>r[3]===WHO).map(r=>r[0]) : []);
const TAB_DIRS = new Set(PERSON ? DATA.rates.filter(r=>r[3]===WHO && /продюсер/i.test(r[1]) && DATA.dirs.some(d=>d[0]===r[0]&&d[6])).map(r=>r[0]) : []);
if(PERSON){ DATA.acc=(DATA.acc||[]).filter(a=>a[2]===WHO); DATA.pay=(DATA.pay||[]).filter(p=>p[6]===WHO); DATA.debts=(DATA.debts||[]).filter(d=>d[2]===WHO); DATA.roles=(DATA.roles||[]).filter(r=>r[0]===WHO); DATA.docs=[]; DATA.adchat=[];
  DATA.cal=DATA.cal.filter(c=>c[5].split(';').some(d=>MY_DIRS.has(d))).map(c=>{ const x=c.slice(); x[5]=c[5].split(';').filter(d=>MY_DIRS.has(d)).join(';'); return x; }); }
const DIRS = Object.fromEntries(DATA.dirs.map(d=>[d[0],{code:d[0],contract:d[1],name:d[2],unit:d[3],price:d[4],plan:d[5],league:d[6],where:d[7],rule:d[8]}]));
const CONTRACTS = DATA.contracts.map(c=>({code:c[0],num:c[1],date:c[2],subject:c[3],status:c[4],limit:c[5],days:c[6]}));
const RATES = DATA.rates.map(r=>({dir:r[0],pos:r[1],rate:r[2],who:r[3],rule:r[4]}));
const CAL = DATA.cal.map(c=>({date:new Date(c[0]),iso:c[0],league:c[1],team:c[2],opp:c[3],home:c[4]==='дома',dirs:c[5].split(';'),note:c[6],played:c[7]==='сыгран'}));
const PEOPLE = DATA.people.map(p=>({name:p[0],st:p[1],form:p[2],note:p[3]}));
const DEBTS = (DATA.debts||[]).map(d=>({date:d[0],project:d[1]||'Трактор',who:d[2],op:d[3],sum:d[4]||0,form:d[5]||'',note:d[6]||'',by:d[7]||'',when:d[8]||'',month:d[9]||''})); // month — за какой месяц зачёт (дата — день операции)
// Чат по рекламе (Telegram → лист «Реклама_чат»): сообщения Архипова и Левиной, привязанные к матчу «дата|лига»
// Должности (лист «Должности»): что делать, регламент, штрафы — по человеку, показывается в его карточке
const ROLES=(DATA.roles||[]).map(r=>({who:r[0],ord:r[1]||0,sec:r[2]||'',title:r[3]||'',text:String(r[4]||'')}));
function roleText(t){ const h=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); const out=[]; let ul=[]; const flush=()=>{ if(ul.length){ out.push('<ul style="margin:6px 0 8px;padding-left:18px">'+ul.map(x=>'<li style="margin:4px 0">'+h(x)+'</li>').join('')+'</ul>'); ul=[]; } };

/* Табель: техника и Футерман — неизменные единицы, в форме не показываются (Мельников 22.09.2026); постоянные люди — свёрнуты; заполняются только меняющиеся позиции. */
function isFixed(r){ return /Футерман/.test(r.who)||/техника|аренда/.test(r.rule); }

function tabelFilled(dir,g){ const e=TAB[tabKey(g)]||{}; const need=tabelRows(dir,g); const val=r=>{ const id=dir+'|'+r.pos; const n=(e.names||{}); return (id in n)?String(n[id]||'').trim():tabelDefault(r); }; return {rows:need.length, need:need.length, done:need.filter(r=>val(r)).length, missing:need.filter(r=>!val(r)).map(r=>tabelLabel(r).title), confirmed:!!e.confirmed}; }
/* Подписи позиций в форме табеля: операторы — «Камера N», микс-зона — доплата оператору одной из камер */
function tabelLabel(r){ let m=r.pos.match(/^Оператор (\d)\s*(?:\((.*)\))?/); if(m) return {title:'Камера '+m[1], sub:(m[2]||{'1':'','2':'','4':'Романов, наличные','5':'только МХЛ'}[m[1]]||'')}; if(/микс-зон/i.test(r.pos)) return {title:'Микс-зона', sub:'доплата оператору одной из камер; обычно Абрамов, если он на выезде — Махиня'}; return {title:r.pos, sub:''}; }
function tabelHint(r){ if(/микс-зон/i.test(r.pos)) return 'Абрамов или Махиня'; if(/чередуются/.test(r.rule)) return r.who.replace(/\s*\/\s*/g,' или '); if(isRot(r)){ const m=r.who.match(/\((.*)\)/); return m?m[1].replace(/,\s*/g,' / '):'фамилия'; } return r.who; }

function tabelMatch(iso,lg){ const g=CAL.find(x=>x.iso===iso&&x.league===lg); const e=TAB[tabKey(g)]||{names:{},adv:{},otv:false,confirmed:false}; const names=e.names||{}, adv=e.adv||{};

  g.dirs.forEach(d=>tabelRows(d,g).filter(r=>/смены рекламы/.test(r.rule)).forEach(r=>{ const id=d+'|'+r.pos; if(!(id in adv)){ adv[id]=chatAdv; e.adv=adv; TAB[tabKey(g)]=e; saveTab(); } }));

  ${e.confirmed?`<div class="g pad" style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><span class="stripe" style="background:var(--good)"></span><div style="flex:1;font-size:13.5px"><b>Состав подтверждён.</b> Начисления по этому матчу идут вписанным людям.</div><button id="tab-edit" class="chip info" style="border:0;cursor:pointer">изменить</button></div>`:''}

  ${g.dirs.filter(d=>!PERSON||TAB_DIRS.has(d)).map(d=>{ const all=tabelRows(d,g); const f=tabelFilled(d,g);
    const rowHtml=r=>{ const rot=isRot(r); const ad=/смены рекламы/.test(r.rule); const id=`${d}|${r.pos}`; const L=tabelLabel(r); const cur=(id in names)?String(names[id]||'').trim():tabelDefault(r);
      return `<div class="row" style="flex-wrap:wrap;${cur?'':'background:var(--warn-bg)'}"><div class="t" style="flex:1 1 130px"><b>${L.title}</b><span>${[L.sub, (MONEY||r.who===WHO)?fmtS(r.rate)+' ₽':''].filter(Boolean).join(' · ')}</span></div><div style="flex:1 1 160px;display:flex;gap:8px;align-items:center">${inp(id, tabelDefault(r), tabelHint(r))}${ad?`<label style="font-size:12px;white-space:nowrap;display:flex;gap:4px;align-items:center"><input type="checkbox" class="chk" data-tabel="1" data-id="adv:${id}" ${advOn(id)?'checked':''} ${e.confirmed?'disabled':''}>реклама</label>`:''}</div></div>`; };
    const isOp=r=>/^Оператор|микс-зон/i.test(r.pos); const ops=all.filter(isOp).sort((a,b)=>tabelLabel(a).title.localeCompare(tabelLabel(b).title,'ru')); const rest=all.filter(r=>!isOp(r));
    return `<div class="sec" style="margin-top:14px">${DIRS[d].name}<small>${f.done} из ${f.need} заполнено</small></div><div class="g list" style="margin-top:8px">${rest.map(rowHtml).join('')}</div>

}

let sx=0, sy=0; on($('#sheet'),'touchstart',e=>{ sx=e.target.closest('input,select,textarea,summary')?null:e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true}); on($('#sheet'),'touchend',e=>{ if(sx===null) return; let dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; const r=document.documentElement.dataset.rot; if(r==='90'){ [dx,dy]=[-dy,dx]; } else if(r==='270'){ [dx,dy]=[dy,-dx]; } dy=Math.abs(dy); if(dx>100&&dy<70&&dx>dy*1.5) goBack(); },{passive:true});
window.__rerender=function(){ const cur=document.querySelector('.tab[aria-selected="true"]'); const tab=cur?cur.dataset.tab:'home'; const stack=STACK.slice(); const sc=$('#sheet-body').scrollTop; show(VIEWS[tab]?tab:'home'); if(stack.length){ STACK.length=0; stack.forEach(k=>STACK.push(k)); renderSheet(stack[stack.length-1]); $('#sheet').classList.add('open'); $('#sheet-body').scrollTop=sc; } };
if(window.__booted){ window.__rerender(); } else { window.__booted=true; show('home'); }
}

function gate(msg){ document.getElementById('v-home').innerHTML=`<div class="lt" style="margin-top:40px"><h1>Трактор 26/27</h1><p>${msg||'Откройте приложение по своей личной ссылке или вставьте её сюда'}</p></div>
  <div class="g pad"><input id="klink" inputmode="url" placeholder="Вставьте сюда свою ссылку" style="width:100%;font:600 15px Manrope,sans-serif;padding:12px 14px;border:1px solid #DDE1E6;border-radius:14px;background:#F6F7F9">
  <button id="kgo" class="tile" style="margin-top:10px;background:var(--accent);color:#fff;font-weight:800;padding:13px;border-radius:14px;text-align:center">Открыть</button></div>`;
  document.getElementById('kgo').onclick=()=>{ const v=document.getElementById('klink').value.trim(); let k=v; try{ k=new URL(v).searchParams.get('k')||v; }catch(e){} location.href=location.pathname+'?k='+encodeURIComponent(k); }; }
function toData(j){ const n=x=>(x===''||x==null)?0:(typeof x==='number'?x:parseFloat(String(x).replace(/\s/g,'').replace(',','.'))||0);
  const today=j.today||new Date().toISOString().slice(0,10);
  return {
    contracts:(j['Договоры']||[]).map(r=>[r['Код'],r['Номер'],r['Дата'],r['Предмет'],r['Статус'],n(r['Лимит с НДС']),n(r['Оплата, дней после акта']),r['Паспорт']||'']),
    dirs:(j['Направления']||[]).map(r=>[r['Код'],r['Договор'],r['Название'],r['Ед.'],n(r['Цена без НДС']),n(r['План кол-во']),r['Лига']||'',r['Где']||'',r['Правило количества']||'']),
    rates:(j['Ставки']||[]).map(r=>[r['Направление'],r['Позиция'],n(r['Ставка']),r['Кому'],r['Правило']||'каждая игра']),
    people:(j['Люди']||[]).map(r=>[r['Человек'],r['Статус']||'',r['Форма оплаты']||'',r['Примечание']||'']),
    cal:(j['Календарь']||[]).map(r=>[r['Дата'],r['Лига'],r['Команда'],r['Соперник'],r['Дома/выезд'],r['Направления'],r['Примечание']||'',(r['Дата']<today)?'сыгран':'впереди']),
    events:(j['События']||[]).map(r=>[r['Дата'],r['Название'],r['Тип']||'',r['Направление']||'',n(r['Сумма']),r['Примечание']||'']),
    tabel:(j['Табель_подтверждения']||[]).map(r=>({key:r['Ключ'],json:r['Состав (JSON)']})),
    acc:(j['Начисления']||[]).map(r=>[r['Месяц']||'',r['Направление']||'',r['Человек']||'',r['Основание']||'',n(r['Сумма']),r['Форма']||'',r['Статус']||'',r['Примечание']||'']),
    pay:(j['Платежи']||[]).map(r=>[r['Дата']||'',r['Тип (приход/расход)']||'',r['Контрагент']||'',n(r['Сумма']),r['Назначение']||'',r['Направление']||'',r['Человек']||'',r['Месяц начисления']||'',r['Примечание']||'']),
    debts:(j['Долги']||[]).map(r=>[r['Дата']||'',r['Проект']||'Трактор',r['Человек']||'',r['Операция']||'',n(r['Сумма']),r['Форма']||'',r['Примечание']||'',r['Внёс']||'',r['Когда']||'',r['Месяц']||'']),
    adchat:(j['Реклама_чат']||[]).map(r=>[r['Дата']||'',r['Время']||'',r['Кто']||'',r['Текст']||'',r['Матч']||'',r['Реклама']||'',r['Проверено']||'']),
    roles:(j['Должности']||[]).map(r=>[r['Человек']||'',n(r['Порядок']),r['Раздел']||'',r['Заголовок']||'',r['Текст']||'']),
    docs:j.docs||[], role:j.role||'admin', who:j.who||'', today:today, generated:j.generated||'' }; }
function fetchData(k){ const u=DATA_URL+'?k='+encodeURIComponent(k); return fetch(u,{cache:'no-store'}).then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); return j; }); }
function jsonp(k){ return new Promise((res,rej)=>{ const cb='cb'+Date.now(); window[cb]=j=>{ delete window[cb]; s.remove(); if(j.error) rej(new Error(j.error)); else res(j); }; const s=document.createElement('script'); s.src=DATA_URL+'?k='+encodeURIComponent(k)+'&callback='+cb; s.onerror=()=>rej(new Error('net')); document.head.appendChild(s); }); }
(async function(){
  if(PLAIN){ boot(PLAIN); return; }
  const url=new URL(location.href); let k=url.searchParams.get('k');
  if(k){ try{localStorage.setItem('tr.key',k);}catch(e){} } else { try{k=localStorage.getItem('tr.key');}catch(e){} }
  if(!k){ gate(); return; }
  window.DATA_URL=DATA_URL; window.KEY=k;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem('tr.data')||'null'); }catch(e){}
  if(cached){ boot(toData(cached)); const p=document.querySelector('.proto'); if(p) p.textContent='обновляю цифры…'; }
  else document.getElementById('v-home').innerHTML='<div class="lt" style="margin-top:40px"><h1>Трактор 26/27</h1><p>загружаю данные…</p></div>';
  /* новая сборка приложения: проверять при «Обновить» и при возврате в приложение — иначе открытое на телефоне остаётся старым кодом (23.09.2026) */
  function swUpd(){ try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(r=>{ if(r) r.update(); }).catch(()=>{}); }catch(e){} }
  window.__refresh=async function(){ swUpd(); try{ let j; try{ j=await fetchData(k); }catch(e){ j=await jsonp(k); } try{ localStorage.setItem('tr.data',JSON.stringify(j)); }catch(e){} boot(toData(j)); return true; }catch(e){ const p=document.querySelector('.proto span'); if(p) p.textContent='нет связи · '+p.textContent; return false; } };
  try{ let j; try{ j=await fetchData(k); }catch(e){ j=await jsonp(k); } try{ localStorage.setItem('tr.data',JSON.stringify(j)); }catch(e){} boot(toData(j)); }
  catch(e){ if(!cached){ if(String(e.message)==='403'){ try{localStorage.removeItem('tr.key');}catch(x){} gate('Ссылка не подошла. Вставьте свою личную ссылку целиком'); } else gate('Нет связи с базой. Проверьте интернет и откройте ссылку ещё раз'); } else { const p=document.querySelector('.proto'); if(p) p.textContent='нет связи · цифры от '+(cached.generated||'…'); } }
  let hidAt=0; document.addEventListener('visibilitychange',()=>{ if(document.hidden) hidAt=Date.now(); else { swUpd(); if(hidAt && Date.now()-hidAt>10*60*1000 && window.__refresh) window.__refresh(); } });
  if('serviceWorker' in navigator && SW){ const had=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had && !window.__reloading){ window.__reloading=true; location.reload(); } }); navigator.serviceWorker.register('sw.js').then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{}); }
})();
