.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 6px 0;font-size:12.5px;font-weight:600;color:var(--muted)}.clegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

<script>
const PLAIN = null;
const DATA_URL = "https://script.google.com/macros/s/AKfycbxCbvLT3P1cEXYuEv2BH8S8xkbIUhY2CsCmjCh339Y8W1yte-hQJCC90o1vMMJbBAKM/exec";
const SW = true;
function boot(DATA){
const TODAY = (()=>{ const s=DATA.today; if(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); } const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); })(); const VAT=0.05, USN=0.06;
const ROLE = DATA.role||'admin';
const DIRS = Object.fromEntries(DATA.dirs.map(d=>[d[0],{code:d[0],contract:d[1],name:d[2],unit:d[3],price:d[4],plan:d[5],league:d[6],where:d[7],rule:d[8]}]));
const CONTRACTS = DATA.contracts.map(c=>({code:c[0],num:c[1],date:c[2],subject:c[3],status:c[4],limit:c[5],days:c[6]}));
const RATES = DATA.rates.map(r=>({dir:r[0],pos:r[1],rate:r[2],who:r[3],rule:r[4]}));
const CAL = DATA.cal.map(c=>({date:new Date(c[0]),iso:c[0],league:c[1],team:c[2],opp:c[3],home:c[4]==='дома',dirs:c[5].split(';'),note:c[6],played:c[7]==='сыгран'}));
const PEOPLE = DATA.people.map(p=>({name:p[0],st:p[1],form:p[2],note:p[3]}));
const EVENTS = (DATA.events||[]).map(e=>({date:new Date(e[0]),iso:e[0],title:e[1],kind:e[2],dir:e[3],sum:e[4]||0,note:e[5]||''}));
/* отметки табеля, ждущие подтверждения */
function todo(){ return played.filter(g=>!(TAB[tabKey(g)]||{}).confirmed); }
const MONTHS_F=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'], MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'], WD=['вс','пн','вт','ср','чт','пт','сб'];
const fmtS=n=>Math.round(n).toLocaleString('ru-RU').replace(/ /g,' '), fmt=n=>fmtS(n)+' ₽';
const dmy=d=>`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
const mkey=d=>`${d.getFullYear()}-${d.getMonth()}`; const mname=k=>{const [y,m]=k.split('-');return `${MONTHS_F[+m]} ${y}`;};
const $=s=>document.querySelector(s); const chev='<svg class="chev" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1l5 5-5 5"/></svg>';
const LG={'КХЛ':'khl','МХЛ':'mhl','ЖХЛ':'zhl'};
/* --- расчёт за игру по направлению --- */
const firstKhl = CAL.find(g=>g.home&&g.league==='КХЛ');
let TAB={}; function loadTab(){ TAB={}; (DATA.tabel||[]).forEach(r=>{ try{ TAB[r.key]=JSON.parse(r.json||'{}'); }catch(e){} }); let loc={}; try{ loc=JSON.parse(localStorage.getItem('tr.tabel2')||'{}'); }catch(e){} Object.keys(loc).forEach(k=>{ if(!TAB[k]||!TAB[k].confirmed) TAB[k]=loc[k]; }); } loadTab();
function saveTab(){ try{ localStorage.setItem('tr.tabel2',JSON.stringify(TAB)); }catch(e){} }
function pushTab(key){ if(!window.DATA_URL||!window.KEY) return Promise.resolve(false); return fetch(window.DATA_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:window.KEY,action:'tabel',key,entry:TAB[key]})}).then(r=>r.json()).then(j=>!!j.ok).catch(()=>false); }
function tabKey(g){ return g.iso+'|'+g.league; }
function resolveName(s){ s=(s||'').trim(); if(!s) return ''; const sur=s.split(/\s+/)[0].toLowerCase(); const p=PEOPLE.find(p=>p.name.split(/\s+/)[0].toLowerCase()===sur); return p?p.name:s; }
function crew(dir,g){ let rows=RATES.filter(r=>r.dir===dir && !(r.rule.startsWith('приостановлено') && g!==firstKhl)); const e=g&&TAB[tabKey(g)]; if(!e||!e.confirmed) return rows;
  if(e.otv && dir==='TR_MHL') return [];
  return rows.filter(r=>!(/смены рекламы/.test(r.rule) && !(e.adv||{})[dir+'|'+r.pos])).map(r=>{ const n=(e.names||{})[dir+'|'+r.pos]; return n?Object.assign({},r,{who:resolveName(n)}):r; }); }
function extraPeople(){ const s=new Set(); Object.values(TAB).forEach(e=>{ if(!e.confirmed) return; Object.values(e.names||{}).forEach(n=>{ const r=resolveName(n); if(r && !PEOPLE.some(p=>p.name===r)) s.add(r); }); }); return [...s].map(n=>({name:n,st:'по табелю',form:'уточнить',note:'внесён из табеля',extra:true})); }
function allPeople(){ return PEOPLE.concat(extraPeople()); }
function payOf(dir,g){ return crew(dir,g).reduce((s,r)=>s+r.rate,0); }
function econ(dir,g){ const d=DIRS[dir]; const pay=payOf(dir,g); const office=crew(dir,g).filter(r=>r.who==='Фонд «Офис»').reduce((s,r)=>s+r.rate,0);
  return {club:d.price*(1+VAT), vat:d.price*VAT, usn:d.price*USN, pay, office, me:d.price - d.price*USN - pay}; }
function gameEcon(g){ const t={club:0,vat:0,usn:0,pay:0,office:0,me:0}; g.dirs.forEach(dir=>{const e=econ(dir,g); for(const k in t) t[k]+=e[k];}); return t; }
function sum(games){ const t={club:0,vat:0,usn:0,pay:0,office:0,me:0,n:0}; games.forEach(g=>{const e=gameEcon(g); for(const k in e) t[k]+=e[k]; t.n++;}); return t; }
const played=CAL.filter(g=>g.played), monthKeys=[...new Set(CAL.map(g=>mkey(g.date)))];

const VIEWS = ROLE==='producer' ? {home:()=>todoSheet().replace('<div class="lt"><h1>Табель</h1>','<div class="lt"><h1>Табель матчей</h1>'), cal:calView} : {home,cal:calView,contracts,people,money};
if(ROLE==='producer'){ document.querySelectorAll('.tab').forEach(b=>{ if(!(b.dataset.tab in VIEWS)) b.remove(); else if(b.dataset.tab==='home') b.querySelector('span').textContent='Табель'; }); }
function show(tab){ document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab)); Object.keys(VIEWS).forEach(k=>{const v=$('#v-'+k); v.hidden=k!==tab; if(k===tab){v.innerHTML=VIEWS[k](); v.classList.remove('in'); void v.offsetWidth; v.classList.add('in'); v.scrollTop=0;}}); try{localStorage.setItem('tr.tab',tab);}catch(e){} }
const STACK=[];
function openSheet(key,replace){ if(replace||STACK[STACK.length-1]===key) STACK[STACK.length-1]=key; else STACK.push(key); renderSheet(key); }
function goBack(){ STACK.pop(); if(STACK.length) renderSheet(STACK[STACK.length-1]); else $('#sheet').classList.remove('open'); }
function renderSheet(key){ const [kind,...rest]=key.split(':'); const id=rest.join(':'); let body='';
  if(kind==='game'){ const [iso,lg]=id.split(':'); body=gameSheet(CAL.find(g=>g.iso===iso&&g.league===lg)); } else if(kind==='day') body=daySheet(id); else if(kind==='person') body=personSheet(+id); else if(kind==='month') body=monthSheet(id); else if(kind==='contract') body=contractSheet(id); else if(kind==='office') body=officeSheet(); else if(kind==='todo'||kind==='tabel') body=todoSheet(); else if(kind==='tp') body=tabelProject(id); else if(kind==='tm'){ const [iso,lg]=id.split(':'); curTab=iso+'|'+lg; body=tabelMatch(iso,lg); } else if(kind==='pm'){ const [pi,mk]=id.split(':'); body=personMonthSheet(+pi,mk); } else if(kind==='other') body=otherSheet(); else if(kind==='docs') body=docsSheet(); else if(kind==='docsec') body=docSecSheet(id); else if(kind==='doc') body=docSheet(id);
  $('#sheet-body').innerHTML=`<button class="back" id="back"><svg viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7.5 1.5l-6 6 6 6"/></svg>Назад</button>`+body; $('#sheet').classList.add('open'); $('#sheet-body').scrollTop=0; }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tab],[data-open],[data-cal],#back'); if(!t) return;
  if(t.id==='back'){goBack();return;} if(t.dataset.cal){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(+t.dataset.cal),1); $('#v-cal').innerHTML=calView(); return; }
  if(t.dataset.open){openSheet(t.dataset.open);return;} if(t.dataset.tab){STACK.length=0;$('#sheet').classList.remove('open');show(t.dataset.tab);} });
let curTab=null;
function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); } el.textContent=msg; el.className='on'; clearTimeout(el._t); el._t=setTimeout(()=>{el.className='';},1400); }
document.addEventListener('click',e=>{ const c=e.target.closest('[data-copy]'); if(c){ const v=c.dataset.copy; if(v){ (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать')); } return; }
  const cp=e.target.closest('#doc-copy'); if(cp){ const txt=docText(cp.dataset.sec,cp.dataset.doc); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать')); return; }
  const sh=e.target.closest('#doc-share'); if(sh){ const txt=docText(sh.dataset.sec,sh.dataset.doc); if(navigator.share) navigator.share({text:txt}).catch(()=>{}); else (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Скопировано, отправка недоступна')).catch(()=>{}); } });
document.addEventListener('input',e=>{ const el=e.target; if(!el.dataset||!el.dataset.tab||!curTab) return; const en=TAB[curTab]=TAB[curTab]||{names:{},adv:{},otv:false,confirmed:false}; en.names=en.names||{}; en.adv=en.adv||{};
  const id=el.dataset.id; if(id==='otv') en.otv=el.checked; else if(id.startsWith('adv:')) en.adv[id.slice(4)]=el.checked; else en.names[id]=el.value; saveTab(); });
document.addEventListener('click',e=>{ const b=e.target.closest('#tab-confirm,#tab-edit'); if(!b||!curTab) return; const en=TAB[curTab]=TAB[curTab]||{names:{},adv:{},otv:false,confirmed:false}; en.confirmed=(b.id==='tab-confirm'); saveTab(); const [iso,lg]=curTab.split('|'); b.textContent='Сохраняю…'; pushTab(curTab).then(ok=>{ if(!ok && window.DATA_URL) alert('Не удалось отправить в базу, сохранено на телефоне. Повторите позже.'); openSheet('tm:'+iso+':'+lg,true); }); });
let sx=0; $('#sheet').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true}); $('#sheet').addEventListener('touchend',e=>{ if(sx<40&&e.changedTouches[0].clientX-sx>90) goBack(); },{passive:true});
let start='home'; try{start=localStorage.getItem('tr.tab')||'home';}catch(e){} show(VIEWS[start]?start:'home');
}

function gate(msg){ document.getElementById('v-home').innerHTML=`<div class="lt" style="margin-top:40px"><h1>Трактор 26/27</h1><p>${msg||'Откройте приложение по своей личной ссылке или вставьте её сюда'}</p></div>
  <div class="g pad"><input id="klink" inputmode="url" placeholder="Вставьте сюда свою ссылку" style="width:100%;font:600 15px Manrope,sans-serif;padding:12px 14px;border:1px solid #DDE1E6;border-radius:14px;background:#F6F7F9">
  <button id="kgo" class="tile" style="margin-top:10px;background:var(--accent);color:#fff;font-weight:800;padding:13px;border-radius:14px;text-align:center">Открыть</button></div>`;
  document.getElementById('kgo').onclick=()=>{ const v=document.getElementById('klink').value.trim(); let k=v; try{ k=new URL(v).searchParams.get('k')||v; }catch(e){} location.href=location.pathname+'?k='+encodeURIComponent(k); }; }
function toData(j){ const n=x=>(x===''||x==null)?0:(typeof x==='number'?x:parseFloat(String(x).replace(/\s/g,'').replace(',','.'))||0);
  const today=j.today||new Date().toISOString().slice(0,10);
  return {
    contracts:(j['Договоры']||[]).map(r=>[r['Код'],r['Номер'],r['Дата'],r['Предмет'],r['Статус'],n(r['Лимит с НДС']),n(r['Оплата, дней после акта']),r['Паспорт']||'']),
    dirs:(j['Направления']||[]).map(r=>[r['Код'],r['Договор'],r['Название'],r['Ед.'],n(r['Цена без НДС']),n(r['План кол-во']),r['Лига']||'',r['Где']||'',r['Правило количества']||'']),
    rates:(j['Ставки']||[]).map(r=>[r['Направление'],r['Позиция'],n(r['Ставка']),r['Кому'],r['Правило']||'каждая игра']),
    people:(j['Люди']||[]).map(r=>[r['Человек'],r['Статус']||'',r['Форма оплаты']||'',r['Примечание']||'']),
    cal:(j['Календарь']||[]).map(r=>[r['Дата'],r['Лига'],r['Команда'],r['Соперник'],r['Дома/выезд'],r['Направления'],r['Примечание']||'',(r['Дата']<today)?'сыгран':'впереди']),
    events:(j['События']||[]).map(r=>[r['Дата'],r['Название'],r['Тип']||'',r['Направление']||'',n(r['Сумма']),r['Примечание']||'']),
    tabel:(j['Табель_подтверждения']||[]).map(r=>({key:r['Ключ'],json:r['Состав (JSON)']})),
    docs:j.docs||[], role:j.role||'admin', today:today, generated:j.generated||'' }; }
function fetchData(k){ const u=DATA_URL+'?k='+encodeURIComponent(k); return fetch(u,{cache:'no-store'}).then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error); return j; }); }
function jsonp(k){ return new Promise((res,rej)=>{ const cb='cb'+Date.now(); window[cb]=j=>{ delete window[cb]; s.remove(); if(j.error) rej(new Error(j.error)); else res(j); }; const s=document.createElement('script'); s.src=DATA_URL+'?k='+encodeURIComponent(k)+'&callback='+cb; s.onerror=()=>rej(new Error('net')); document.head.appendChild(s); }); }
(async function(){
  if(PLAIN){ boot(PLAIN); return; }
  const url=new URL(location.href); let k=url.searchParams.get('k');
  if(k){ try{localStorage.setItem('tr.key',k);}catch(e){} } else { try{k=localStorage.getItem('tr.key');}catch(e){} }
  if(!k){ gate(); return; }
  window.DATA_URL=DATA_URL; window.KEY=k;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem('tr.data')||'null'); }catch(e){}
  if(cached){ boot(toData(cached)); const p=document.querySelector('.proto'); if(p) p.textContent='обновляю цифры…'; }
  else document.getElementById('v-home').innerHTML='<div class="lt" style="margin-top:40px"><h1>Трактор 26/27</h1><p>загружаю данные…</p></div>';
  try{ let j; try{ j=await fetchData(k); }catch(e){ j=await jsonp(k); } try{ localStorage.setItem('tr.data',JSON.stringify(j)); }catch(e){} boot(toData(j)); }
  catch(e){ if(!cached){ if(String(e.message)==='403'){ try{localStorage.removeItem('tr.key');}catch(x){} gate('Ссылка не подошла. Вставьте свою личную ссылку целиком'); } else gate('Нет связи с базой. Проверьте интернет и откройте ссылку ещё раз'); } else { const p=document.querySelector('.proto'); if(p) p.textContent='нет связи · цифры от '+(cached.generated||'…'); } }
  if('serviceWorker' in navigator && SW){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
</body></html>
