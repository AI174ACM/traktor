<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Трактор 26/27</title>
<link rel="stylesheet" href="fonts/fonts.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Трактор"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ECEEF1"><meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  color-scheme:light;
  --ground:#EEEDEA;--ink:#111111;--muted:#6C6B67;--faint:#A6A5A0;--card:#FFFFFF;--sep:#EFEEEA;--soft:#F2F1EE;
  --accent:#FF5A1F;--accent-bg:#FFE7DB;
  --khl:#2B2D33;--khl-bg:#E6E5E1;--khl-bg2:#CFCEC8;--mhl:#1E8A58;--mhl-bg:#DDF1E5;--zhl:#B0508E;--zhl-bg:#F5E2EC;--away:#9AA3B0;
  --club:#1E9E63;--crew:#3F86DD;--tax:#8A8F98;--me:#FF5A1F;--office:#C2589B;
  --good:#157A4C;--good-bg:#E1F4EA;--warn:#A64A12;--warn-bg:#FFEBD9;--bad:#B3301D;--bad-bg:#FDE2DE;
  --spring:cubic-bezier(.3,1.35,.5,1);--num:Manrope,system-ui,sans-serif;--mono:'Martian Mono',ui-monospace,monospace;--r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:15px/1.38 Manrope,-apple-system,system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{position:fixed;inset:0;margin:0 auto;max-width:520px}
.views{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 112px);background:var(--ground)}
.views::-webkit-scrollbar{display:none}
.views.in>*{animation:rise .5s var(--spring) both}
.views.in>*:nth-child(2){animation-delay:.03s}.views.in>*:nth-child(3){animation-delay:.06s}.views.in>*:nth-child(n+4){animation-delay:.09s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.views.in>*{animation:none}.sheet{transition:none}}
.tabbar{position:absolute;left:14px;right:14px;bottom:max(14px,calc(env(safe-area-inset-bottom,0px) - 4px));z-index:6;display:flex;gap:2px;padding:6px;border-radius:36px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(15,20,25,.14)}
.tab{flex:1;appearance:none;border:0;background:transparent;color:#5E6570;font:600 10.5px/1.1 Manrope,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:30px;cursor:pointer;transition:background .25s,color .25s}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:#fff;background:var(--accent);box-shadow:0 4px 12px rgba(255,90,31,.28)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:absolute;inset:0;z-index:8;overflow:hidden;background:var(--ground);transform:translateX(104%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s linear .5s;box-shadow:-18px 0 40px rgba(0,0,0,.14)}
.sheet.open{transform:none;visibility:visible;transition:transform .5s var(--spring),visibility 0s}
.sheet .views{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.back{position:sticky;top:0;z-index:3;appearance:none;background:#fff;border:0;box-shadow:0 6px 18px rgba(15,20,25,.12);color:var(--accent);font:700 15px Manrope,sans-serif;padding:8px 16px 8px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin:0 0 12px}
.back svg{width:9px;height:15px}
.proto{margin:0 0 14px;padding:8px 12px;border-radius:14px;background:#E4E3DF;color:#5E5D59;font:600 12px/1.35 Manrope,sans-serif}
.lt{margin:6px 4px 16px}
.lt h1{font:800 32px/1.05 Manrope,sans-serif;letter-spacing:-.045em;margin:0;text-wrap:balance}
.lt p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.g{background:var(--card);border-radius:var(--r);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.pad{padding:16px 17px}
.tile{appearance:none;border:0;display:block;width:100%;text-align:left;cursor:pointer;transition:transform .35s var(--spring)}
.tile:active,button.row:active,.day:active{transform:scale(.96);transition-duration:.12s}
.tile-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{margin:24px 6px 0;font:800 19px/1.2 Manrope,sans-serif;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec small{font:600 13px Manrope,sans-serif;color:var(--muted)}
.lbl{font-size:13px;color:var(--muted);font-weight:600}.lbl.c{font-weight:700}
.num{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.045em;white-space:nowrap}
.mono{font-family:var(--mono);font-weight:500;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.big{font-size:28px;line-height:1.1;margin-top:4px}
.sub{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;appearance:none;border:0;background:transparent;text-align:left;min-height:56px}
button.row{cursor:pointer;transition:transform .35s var(--spring)}
.list .row+.row{border-top:1px solid var(--sep)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.row .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-variant-numeric:tabular-nums;font-weight:800;font-size:15.5px;white-space:nowrap;text-align:right;letter-spacing:-.03em}
.row .v small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;letter-spacing:0}
.chev{color:var(--faint);width:7px;height:12px;flex:none}
.row.now{background:var(--accent-bg);box-shadow:inset 4px 0 0 var(--accent)}
.tile.now{box-shadow:inset 4px 0 0 var(--accent)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:800 14px Manrope,sans-serif}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--soft);color:var(--muted)}.chip.ak{background:var(--accent-bg);color:var(--accent)}
.chip.khl{background:var(--khl-bg);color:var(--khl)}.chip.mhl{background:var(--mhl-bg);color:var(--mhl)}.chip.zhl{background:var(--zhl-bg);color:var(--zhl)}
.dateb{width:46px;height:48px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dateb b{font:500 16px/1 var(--mono);letter-spacing:-.06em}.dateb span{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:700}
.dateb.khl{background:var(--khl-bg)}.dateb.khl b{color:var(--khl)}.dateb.mhl{background:var(--mhl-bg)}.dateb.mhl b{color:var(--mhl)}
.card{border-radius:var(--r);padding:18px 18px 16px;color:var(--ink);background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.02);position:relative;overflow:hidden;border-top:5px solid var(--accent)}
.card .lbl{color:var(--muted)}.card .mono{font-size:32px;color:var(--ink);margin-top:6px;display:block}
.card .foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:600}.card .foot b{color:var(--ink)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex;margin-top:10px}.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .g{padding:14px 15px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--sep);font-size:14px}.kv:first-child{border-top:0}
.kv b{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.kv.me{color:var(--me)}.kv.of{color:var(--office)}
.note{margin:14px 6px 0;font-size:12.5px;color:var(--muted);line-height:1.45}.note b{color:var(--ink)}
.stripe{width:5px;align-self:stretch;border-radius:3px;flex:none}
.fio{width:100%;min-width:0;font:600 14px Manrope,sans-serif;padding:9px 11px;border:1px solid #DDDBD5;border-radius:12px;background:#FAF9F7;color:var(--ink)}
.fio:focus{outline:2px solid var(--accent);border-color:transparent}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none}
label.row{cursor:pointer}
/* календарь */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px}
.mnav b{font:800 20px Manrope,sans-serif;letter-spacing:-.03em}
.mnav button{appearance:none;border:0;background:#fff;width:38px;height:38px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.mnav button svg{width:9px;height:15px}
.cal{background:var(--card);border-radius:var(--r);padding:12px 10px 10px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}.wd span{text-align:center;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{appearance:none;border:0;background:transparent;aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:default;position:relative;transition:transform .35s var(--spring)}
.day b{font:700 14.5px Manrope,sans-serif;color:var(--ink)}
.day.off b{color:var(--faint);font-weight:600}
.day.has{cursor:pointer}
.day.khl{background:var(--khl-bg)}.day.khl b{color:var(--khl)}
.day.mhl{background:var(--mhl-bg)}.day.mhl b{color:var(--mhl)}
.day.zhl{background:var(--zhl-bg)}.day.zhl b{color:var(--zhl)}
.day.away{background:#fff;box-shadow:inset 0 0 0 1.5px var(--khl-bg2)}.day.away b{color:var(--khl)}
.day.two{background:linear-gradient(135deg,var(--khl-bg) 50%,var(--mhl-bg) 50%)}.day.two b{color:var(--ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.next{box-shadow:inset 0 0 0 2px var(--accent),0 4px 12px rgba(255,90,31,.25)}
.day.next b{color:var(--accent)}
.day.past.has{opacity:.72}
.day.ev:before{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.day .d{display:flex;gap:2px}.day .d i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.day.khl .d i{color:var(--khl)}.day.mhl .d i{color:var(--mhl)}.day.zhl .d i{color:var(--zhl)}.day.away .d i{color:var(--khl)}
.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 6px 0;font-size:12.5px;font-weight:600;color:var(--muted)}.clegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
</style></head><body>

  return {club:d.price*(1+VAT), vat:d.price*VAT, usn:d.price*USN, pay, office, me:d.price - d.price*USN - pay}; }
function gameEcon(g){ const t={club:0,vat:0,usn:0,pay:0,office:0,me:0}; g.dirs.forEach(dir=>{const e=econ(dir,g); for(const k in t) t[k]+=e[k];}); return t; }
function sum(games){ const t={club:0,vat:0,usn:0,pay:0,office:0,me:0,n:0}; games.forEach(g=>{const e=gameEcon(g); for(const k in e) t[k]+=e[k]; t.n++;}); return t; }

  <div class="sec">2. Людям и за технику<small>нажмите человека</small></div><div class="g list" style="margin-top:10px">${allPeople().map((p,i)=>{const a=personGames(p.name,gs.filter(g=>g.played)), pl=personGames(p.name,gs); return pl.n?`<button class="row" data-open="pm:${i}:${k}"><div class="av" style="background:${pcolor(i)}">${p.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</div><div class="t"><b>${p.name}</b><span>${pl.n} матчей · ${p.form}</span></div><div class="v">${fmtS(a.s)}<small>план ${fmtS(pl.s)}</small></div>${chev}</button>`:'';}).join('')}<div class="row"><div class="t"><b>Меняющиеся позиции без фамилии</b><span>кто вышел — подтверждается в табеле</span></div><div class="v">${fmtS(gs.reduce((s,g)=>s+g.dirs.reduce((x,d)=>x+crew(d,g).filter(r=>!allPeople().some(p=>p.name===r.who)&&r.who!=='Фонд «Офис»').reduce((y,r)=>y+r.rate,0),0),0))}</div></div><div class="row of"><div class="t"><b>В фонд «Офис»</b><span>с каждого матча</span></div><div class="v" style="color:var(--office)">${fmtS(m.office)}</div></div><div class="row" style="background:var(--soft)"><div class="t"><b>Итого людям и в фонд</b><span>по сыгранным ${fmtS(mp.pay)}</span></div><div class="v">${fmtS(m.pay)}</div></div></div>
  <div class="sec">3. Что остаётся</div><div class="g pad" style="margin-top:10px"><div class="bar" style="margin-top:0"><i style="width:${(m.pay-m.office)/m.club*100}%;background:var(--crew)"></i><i style="width:${m.office/m.club*100}%;background:var(--office)"></i><i style="width:${(m.vat+m.usn)/m.club*100}%;background:var(--tax)"></i><i style="width:${m.me/m.club*100}%;background:var(--me)"></i></div>
  <div class="kv" style="margin-top:8px"><span>Клубу</span><b>${fmt(m.club)}</b></div><div class="kv"><span>Людям и техника</span><b>− ${fmt(m.pay-m.office)}</b></div><div class="kv of"><span>Фонд «Офис»</span><b>− ${fmt(m.office)}</b></div><div class="kv"><span>НДС и УСН</span><b>− ${fmt(m.vat+m.usn)}</b></div><div class="kv me"><span>Мне</span><b>${fmt(m.me)}</b></div><div class="sub">по сыгранным: мне ${fmtS(mp.me)} ₽</div></div>
  <div class="sec">Матчи</div><div class="g list" style="margin-top:10px">${gs.map(g=>`<button class="row${g===CAL.find(x=>!x.played)?' now':''}" data-open="game:${g.iso}:${g.league}"><div class="dateb ${LG[g.league]}"><b>${String(g.date.getDate()).padStart(2,'0')}</b><span>${WD[g.date.getDay()]}</span></div><div class="t"><b>${g.team} — ${g.opp}</b><span>${g.league} · ${g.home?'дома':'выезд'}</span></div><div class="v">${fmtS(gameEcon(g).club)}</div>${chev}</button>`).join('')}</div>

  ${g.dirs.map(d=>{const ed=econ(d,g); return `<div class="sec">${DIRS[d].name}<small><button data-open="tm:${g.iso}:${g.league}" style="appearance:none;border:0;background:none;color:var(--accent);font:700 13px Manrope,sans-serif;cursor:pointer">табель</button> · клубу ${fmtS(ed.club)}</small></div><div class="g list" style="margin-top:10px">${crew(d,g).map(r=>`<div class="row"><div class="t"><b>${r.pos}</b><span>${r.who}${r.rule&&r.rule!=='каждая игра'?' · '+r.rule:''}</span></div><div class="v">${fmtS(r.rate)}</div></div>`).join('')}</div>`;}).join('')}`;

function tabelDraft(){ try{ return JSON.parse(localStorage.getItem('tr.tabel')||'{}'); }catch(e){ return {}; } }
function tabelFilled(dir,g){ const e=TAB[tabKey(g)]||{}; const rows=RATES.filter(r=>r.dir===dir&&r.who!=='Фонд «Офис»'&&!(r.rule.startsWith('приостановлено')&&g!==firstKhl)); const need=rows.filter(r=>/по табелю|меняется|чередуются/.test(r.rule+' '+r.who)); return {rows:rows.length, need:need.length, done:need.filter(r=>((e.names||{})[dir+'|'+r.pos]||'').trim()).length, confirmed:!!e.confirmed}; }

function tabelMatch(iso,lg){ const g=CAL.find(x=>x.iso===iso&&x.league===lg); const e=TAB[tabKey(g)]||{names:{},adv:{},otv:false,confirmed:false}; const names=e.names||{}, adv=e.adv||{};
  const inp=(id,val,ph)=>`<input class="fio" data-tab="1" data-id="${id}" value="${(names[id]??val)||''}" placeholder="${ph}" ${e.confirmed?'disabled':''}>`;
  return `<div class="lt"><h1>${g.team} — ${g.opp}</h1><p>${dmy(g.date)} · ${g.league} · ${g.home?'дома':'выезд'} · ${g.played?'сыгран':'впереди'}</p></div>
  ${e.confirmed?`<div class="g pad" style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><span class="stripe" style="background:var(--good)"></span><div style="flex:1;font-size:13.5px"><b>Состав подтверждён.</b> Начисления по этому матчу идут вписанным людям.</div><button id="tab-edit" class="chip info" style="border:0;cursor:pointer">изменить</button></div>`:''}
  ${g.dirs.includes('TR_MHL')?`<div class="g" style="margin-bottom:10px"><label class="row"><div class="t"><b>Матч ушёл на ОТВ</b><span>трансляция не производится, акт по ней не выставляем</span></div><input type="checkbox" class="chk" data-tab="1" data-id="otv" ${e.otv?'checked':''} ${e.confirmed?'disabled':''}></label></div>`:''}
  ${g.dirs.map(d=>`<div class="sec" style="margin-top:14px">${DIRS[d].name}</div><div class="g list" style="margin-top:8px">${RATES.filter(r=>r.dir===d&&r.who!=='Фонд «Офис»'&&!(r.rule.startsWith('приостановлено')&&g!==firstKhl)).map(r=>{ const rot=/по табелю|меняется|чередуются/.test(r.rule+' '+r.who); const ad=/смены рекламы/.test(r.rule); const id=`${d}|${r.pos}`;
    return `<div class="row" style="flex-wrap:wrap"><div class="t" style="flex:1 1 140px"><b>${r.pos}</b><span>${fmtS(r.rate)} ₽${rot?' · кто вышел':''}</span></div><div style="flex:1 1 150px;display:flex;gap:8px;align-items:center">${inp(id, rot?'':r.who, rot?'фамилия':'')}${ad?`<label style="font-size:12px;white-space:nowrap;display:flex;gap:4px;align-items:center"><input type="checkbox" class="chk" data-tab="1" data-id="adv:${id}" ${adv[id]?'checked':''} ${e.confirmed?'disabled':''}>реклама</label>`:''}</div></div>`; }).join('')}</div>`).join('')}
  ${e.confirmed?'':`<button id="tab-confirm" class="tile" style="margin-top:14px;background:var(--accent);color:#fff;font-weight:800;padding:14px;border-radius:16px;text-align:center">Подтвердить состав</button>`}
  <div class="note">Пустые клетки — меняющиеся позиции: впишите фамилию, она найдётся в списке людей. После «Подтвердить» начисления по матчу считаются по этому составу. Черновик и подтверждение хранятся на этом телефоне, позже — в базе.</div>`;
}
function otherSheet(){ const T=DIRS.TTV,S=DIRS.SERIAL,G=DIRS.GRAPH; const gr=(x)=>{const a=x*0.95,b=a*0.94,of=b*0.04,c=b-of,sh=c*0.6,comp=sh*0.07;return {of,sh:sh+comp,ip:c-sh-comp};}; const g=gr(G.price*(1+VAT));
  return `<div class="lt"><h1>Не по матчам</h1><p>считаются по единицам, сериям и приложениям</p></div><div class="stack">

  <div class="g pad"><div class="tile-h"><div style="font-weight:800;font-size:16px">Графика</div><span class="chip info">по приложениям</span></div><div class="kv"><span>Средний месяц 25-26, с НДС</span><b>${fmt(G.price*(1+VAT))}</b></div><div class="kv"><span>Шебельбайну 60 % + 7 %</span><b>${fmt(g.sh)}</b></div><div class="kv of"><span>В фонд «Офис» 4 %</span><b>${fmt(g.of)}</b></div><div class="kv me"><span>Мне</span><b>${fmt(g.ip)}</b></div><div class="sub">правило: приход → −5 % НДС → −6 % УСН → −4 % офис → 60 % Шебельбайну + 7 % сверху. Приложения 26-27 ещё не выставлены.</div></div>
  </div><div class="note">Профайлы игроков идут через ИП Романова — разберём отдельно.</div>`; }
function docsSheet(){ const secs=[['Реквизиты ИП Мельников','ИНН, ОГРНИП, Точка, адреса','var(--accent)'],['Документы ИП','регистрация, уведомление о НДС, доверенности','var(--mhl)'],['Договоры сезона','пять договоров и приложения, статусы и файлы','var(--khl)'],['Люди','статус, форма оплаты, реквизиты для платежей','var(--office)'],['Личные','паспорт, СНИЛС — только для владельца','var(--bad)']];

function officeSheet(){ const inc=monthKeys.map(k=>({k,v:sum(CAL.filter(g=>mkey(g.date)===k)).office, p:sum(CAL.filter(g=>mkey(g.date)===k&&g.played)).office})); const exp=147000; let bal=0;

const VIEWS={home,cal:calView,contracts,people,money};
function show(tab){ document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab)); Object.keys(VIEWS).forEach(k=>{const v=$('#v-'+k); v.hidden=k!==tab; if(k===tab){v.innerHTML=VIEWS[k](); v.classList.remove('in'); void v.offsetWidth; v.classList.add('in'); v.scrollTop=0;}}); try{localStorage.setItem('tr.tab',tab);}catch(e){} }
function openSheet(key){ const [kind,...rest]=key.split(':'); const id=rest.join(':'); let body='';
  if(kind==='game'){ const [iso,lg]=id.split(':'); body=gameSheet(CAL.find(g=>g.iso===iso&&g.league===lg)); } else if(kind==='day') body=daySheet(id); else if(kind==='person') body=personSheet(+id); else if(kind==='month') body=monthSheet(id); else if(kind==='contract') body=contractSheet(id); else if(kind==='office') body=officeSheet(); else if(kind==='todo'||kind==='tabel') body=todoSheet(); else if(kind==='tp') body=tabelProject(id); else if(kind==='tm'){ const [iso,lg]=id.split(':'); curTab=iso+'|'+lg; body=tabelMatch(iso,lg); } else if(kind==='pm'){ const [pi,mk]=id.split(':'); body=personMonthSheet(+pi,mk); } else if(kind==='other') body=otherSheet(); else if(kind==='docs') body=docsSheet();
  $('#sheet-body').innerHTML=`<button class="back" id="back"><svg viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7.5 1.5l-6 6 6 6"/></svg>Назад</button>`+body; $('#sheet').classList.add('open'); $('#sheet-body').scrollTop=0; }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tab],[data-open],[data-cal],#back'); if(!t) return;
  if(t.id==='back'){$('#sheet').classList.remove('open');return;} if(t.dataset.cal){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(+t.dataset.cal),1); $('#v-cal').innerHTML=calView(); return; }
  if(t.dataset.open){openSheet(t.dataset.open);return;} if(t.dataset.tab){$('#sheet').classList.remove('open');show(t.dataset.tab);} });
let curTab=null;
document.addEventListener('input',e=>{ const el=e.target; if(!el.dataset||!el.dataset.tab||!curTab) return; const en=TAB[curTab]=TAB[curTab]||{names:{},adv:{},otv:false,confirmed:false}; en.names=en.names||{}; en.adv=en.adv||{};
  const id=el.dataset.id; if(id==='otv') en.otv=el.checked; else if(id.startsWith('adv:')) en.adv[id.slice(4)]=el.checked; else en.names[id]=el.value; saveTab(); });
document.addEventListener('click',e=>{ const b=e.target.closest('#tab-confirm,#tab-edit'); if(!b||!curTab) return; const en=TAB[curTab]=TAB[curTab]||{names:{},adv:{},otv:false,confirmed:false}; en.confirmed=(b.id==='tab-confirm'); saveTab(); const [iso,lg]=curTab.split('|'); openSheet('tm:'+iso+':'+lg); });

}

function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function decryptWith(k){ const enc=new TextEncoder(); const base=await crypto.subtle.importKey('raw',enc.encode(k),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.data)); return JSON.parse(new TextDecoder().decode(pt)); }
function gate(msg){ document.getElementById('v-home').innerHTML=`<div class="lt" style="margin-top:40px"><h1>Трактор 26/27</h1><p>${msg||'Откройте приложение по своей личной ссылке или вставьте её сюда'}</p></div>
  <div class="g pad"><input id="klink" inputmode="url" placeholder="Вставьте сюда свою ссылку" style="width:100%;font:600 15px Manrope,sans-serif;padding:12px 14px;border:1px solid #DDE1E6;border-radius:14px;background:#F6F7F9">
  <button id="kgo" class="tile" style="margin-top:10px;background:var(--accent);color:#fff;font-weight:800;padding:13px;border-radius:14px;text-align:center">Открыть</button></div>`;
  document.getElementById('kgo').onclick=()=>{ const v=document.getElementById('klink').value.trim(); let k=v; try{ k=new URL(v).searchParams.get('k')||v; }catch(e){} location.href=location.pathname+'?k='+encodeURIComponent(k); }; }
(async function(){
  if(PLAIN){ boot(PLAIN); return; }
  const url=new URL(location.href); let k=url.searchParams.get('k');
  if(k){ try{localStorage.setItem('tr.key',k);}catch(e){} } else { try{k=localStorage.getItem('tr.key');}catch(e){} }
  if(!k){ gate(); return; }
  try{ boot(await decryptWith(k)); }catch(e){ try{localStorage.removeItem('tr.key');}catch(x){} gate('Ссылка не подошла. Вставьте свою личную ссылку целиком'); }
  if('serviceWorker' in navigator && SW){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
